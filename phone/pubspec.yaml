name: safetyapp
description: Offline-first women and child safety app (SOS, emergency contacts, smartwatch trigger).
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.3
  path: ^1.9.0
  geolocator: ^12.0.0
  permission_handler: ^11.3.1
  sensors_plus: ^5.0.1
  url_launcher: ^6.3.0
  http: ^1.2.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
