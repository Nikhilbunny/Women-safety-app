name: Build Android apps

# Runs when you click "Run workflow" on the Actions tab, or when you push.
on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  phone:
    name: Phone app (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Flutter project and apply our sources
        run: bash setup.sh

      - name: Unit tests (does not block the APK)
        id: tests
        continue-on-error: true
        working-directory: build/safetyapp
        run: |
          set -o pipefail
          flutter test 2>&1 | tee ../test.log

      - name: Show unit test failures as an annotation
        if: steps.tests.outcome == 'failure'
        run: |
          msg=$(tail -n 40 build/test.log | head -c 5000 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
          echo "::warning title=Unit tests failed::$msg"

      - name: Build release APK
        working-directory: build/safetyapp
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee ../build.log

      - name: Show build errors as an annotation
        if: failure()
        run: |
          { grep -nE "rror|e: |FAILURE|went wrong|Could not|not found|Unresolved|cannot|Exception" build/build.log | head -40; echo "---- last lines ----"; tail -n 40 build/build.log; } > summary.txt || true
          msg=$(head -c 7000 summary.txt | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
          echo "::error title=Phone build failed::$msg"

      - uses: actions/upload-artifact@v4
        with:
          name: safety-phone-apk
          path: build/safetyapp/build/app/outputs/flutter-apk/app-release.apk

  watch:
    name: Wear OS app (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle -p wear_os assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: safety-wear-apk
          path: wear_os/app/build/outputs/apk/debug/app-debug.apk
